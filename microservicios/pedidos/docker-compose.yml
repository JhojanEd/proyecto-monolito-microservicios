services:
  pedidos-app:
    build: .
    container_name: pedidos-app
    ports:
      - "3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: pedidos-db
      DB_PORT: 5432
      DB_NAME: pedidos_db
      DB_USER: pedidos_user
      DB_PASSWORD: pedidos123
      USUARIOS_URL: http://host.docker.internal:3001/usuarios
      PRODUCTOS_URL: http://host.docker.internal:3002/productos
    depends_on:
      pedidos-db:
        condition: service_healthy

  pedidos-db:
    image: postgres:16
    container_name: pedidos-db
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: pedidos_user
      POSTGRES_PASSWORD: pedidos123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos_user -d pedidos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pedidos_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pedidos_data:
