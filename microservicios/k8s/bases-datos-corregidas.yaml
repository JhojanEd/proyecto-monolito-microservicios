apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-db
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-db
  template:
    metadata:
      labels:
        app: usuarios-db
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: usuarios_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: usuarios-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: usuarios-password
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: datos
        - mountPath: /docker-entrypoint-initdb.d/init.sql
          name: init-script
          subPath: init.sql
      volumes:
      - name: datos
        persistentVolumeClaim:
          claimName: usuarios-pgdata
      - name: init-script
        configMap:
          name: usuarios-init
---
