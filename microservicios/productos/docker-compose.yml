services:
  productos-app:
    build: .
    container_name: productos-app
    ports:
      - "3002:3002"
    environment:
      DB_HOST: productos-db
      DB_PORT: 5432
      DB_NAME: productos_db
      DB_USER: productos_user
      DB_PASSWORD: productos123
    depends_on:
      productos-db:
        condition: service_healthy

  productos-db:
    image: postgres:16
    container_name: productos-db
    environment:
      POSTGRES_DB: productos_db
      POSTGRES_USER: productos_user
      POSTGRES_PASSWORD: productos123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productos_user -d productos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - productos_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  productos_data:

